name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Pinned rather than ubuntu-latest, so a runner image rollover cannot change
    # what CI runs on without a commit saying so.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build
